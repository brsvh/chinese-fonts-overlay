name: Flake checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: font-check-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flake:
    name: Flake checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32.1.0
        with:
          extra_nix_config: |
            accept-flake-config = false
            allow-import-from-derivation = false
            builders =
            experimental-features = nix-command flakes ca-derivations
            extra-substituters = https://cache.brsvh.org
            extra-trusted-public-keys = cache.brsvh.org-1:HqcG/vJ7jeSLU48jV4yg8Ot+rUPP2v0vIAAnDEqVSvk=
      - name: Check source formatting
        run: nix fmt --no-update-lock-file --no-write-lock-file -- --fail-on-change
      - name: Check flake and font metadata
        run: nix flake check --no-update-lock-file --no-write-lock-file --print-build-logs
      - name: Check website with licensed fixtures
        run: nix develop --no-update-lock-file --no-write-lock-file .#pages -c make -C pages -j2 check
      - name: Check the complete HTML and Info manual
        run: nix develop --no-update-lock-file --no-write-lock-file .#manual -c make -C pages check-manual
