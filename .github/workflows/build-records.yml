name: Record font builds

on:
  workflow_run:
    workflows: [Font builds]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: font-build-records-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  record:
    if: github.repository == 'brsvh/chinese-fonts-overlay'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Consume data using the trusted default branch, never PR code or caches.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v32.1.0
        with:
          extra_nix_config: |
            accept-flake-config = false
            allow-import-from-derivation = false
            builders =
            experimental-features = nix-command flakes
      - name: Record validated successful builds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run --no-update-lock-file --no-write-lock-file .#ci -- record-builds
