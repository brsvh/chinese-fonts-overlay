name: deploy
run-name: Deploy Pages ${{ github.event.client_payload.source || github.sha }}

on:
  repository_dispatch:
    types: [pages-ready]
  workflow_dispatch:

permissions: {}

jobs:
  prepare:
    name: Prepare artifact
    if: >-
      github.repository == 'brsvh/chinese-fonts-overlay' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.sender.type == 'Bot' &&
        format('{0}', github.event.sender.id) == vars.CHINESE_FONTS_OVERLAY_PAGES_DISPATCH_BOT_ID))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.receive.outputs.ready }}
      source: ${{ steps.receive.outputs.source }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            accept-flake-config = false
            experimental-features = nix-command flakes ca-derivations
      - name: Download and verify artifact
        id: receive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_DISPATCH_BOT_ID: ${{ vars.CHINESE_FONTS_OVERLAY_PAGES_DISPATCH_BOT_ID }}
          PAGES_S3_ACCESS_KEY_ID: ${{ secrets.CHINESE_FONTS_OVERLAY_PAGES_S3_ACCESS_KEY_ID }}
          PAGES_S3_SECRET_ACCESS_KEY: ${{ secrets.CHINESE_FONTS_OVERLAY_PAGES_S3_SECRET_ACCESS_KEY }}
        run: >-
          nix develop --no-update-lock-file --no-write-lock-file .#ci
          -c node ci/pages.mjs receivePagesArtifact public
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        if: steps.receive.outputs.ready == 'true'
        with:
          path: public
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            accept-flake-config = false
            experimental-features = nix-command flakes ca-derivations
      - name: Check source revision
        id: current
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_SOURCE_REVISION: ${{ needs.prepare.outputs.source }}
        run: >-
          nix develop --no-update-lock-file --no-write-lock-file .#ci
          -c node ci/pages.mjs checkDeploymentRevision "$PAGES_SOURCE_REVISION"
      - uses: actions/deploy-pages@v5.0.1
        id: pages
        if: steps.current.outputs.ready == 'true'
