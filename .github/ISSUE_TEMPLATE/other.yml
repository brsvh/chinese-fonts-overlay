name: 其他问题
description: 反馈与 chinese-fonts-overlay 有关的其他问题。
title: "[其他] "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        如果是安装、配置或使用问题，可以先查阅[在线使用手册](https://brsvh.github.io/chinese-fonts-overlay/manual/)；查看或核对字体条目请访问[字体预览网站](https://brsvh.github.io/chinese-fonts-overlay/)。

  - type: textarea
    id: issue
    attributes:
      label: 问题描述
      description: 请描述你遇到的问题或想讨论的内容。
      placeholder: "发生了什么？你希望讨论或修改什么？"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 相关信息
      description: 请补充包名、命令、链接或日志；网站问题请注明浏览器和筛选条件。
      placeholder: "请补充有助于复现问题的信息，也可以附上截图。"
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 如果适用，请描述你期望发生的结果。
      placeholder: "你期望得到什么结果？"
    validations:
      required: false
