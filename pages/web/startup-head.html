<!-- Keep the first paint stable before styles, fonts or Hoot arrive. -->
<style>
  #page-loader {
    display: none;
  }
  html[data-starting] {
    overflow: hidden;
  }
  html[data-starting] body > :not(#page-loader) {
    visibility: hidden;
  }
  html[data-starting] #page-loader {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #fff;
    color: #595959;
    font: 14px / 1.5 sans-serif;
  }
  .startup-spinner {
    box-sizing: border-box;
    width: 32px;
    height: 32px;
    border: 3px solid #e0e0e0;
    border-top-color: #0031a9;
    border-radius: 50%;
    animation: startup-spin 0.8s linear infinite;
  }
  @media (prefers-color-scheme: dark) {
    html[data-starting] #page-loader {
      background: #000;
      color: #989898;
    }
    .startup-spinner {
      border-color: #303030;
      border-top-color: #2fafff;
    }
  }
  @keyframes startup-spin {
    to {
      transform: rotate(360deg);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .startup-spinner {
      animation: none;
    }
  }
</style>
<script>
  (() => {
    const root = document.documentElement;
    root.setAttribute('data-starting', '');

    let settled = false;
    let resolveFonts;

    window.sitePresentationReady = new Promise((resolve) => {
      resolveFonts = resolve;
    });

    window.settleSiteFonts = (ready) => {
      if (settled) return;

      settled = true;
      root.dataset.fonts = ready ? 'ready' : 'fallback';
      resolveFonts();
    };

    // Each entry waits for the same font gate. The preview also waits for
    // its first result set; a static manual chapter is already readable.
    const contentReady = new Promise((resolve) => {
      window.finishSiteStartup = resolve;
    });

    let resolveReveal;
    window.siteRevealed = new Promise((resolve) => {
      resolveReveal = resolve;
    });

    Promise.all([window.sitePresentationReady, contentReady]).then(() => {
      clearTimeout(timeout);

      const reveal = () => {
        root.removeAttribute('data-starting');
        resolveReveal();
      };
      if (document.hidden) reveal();
      else requestAnimationFrame(() => requestAnimationFrame(reveal));
    });

    // Failed enhancement must leave static content readable. Once revealed,
    // a timed-out page keeps its fallback fonts for this entire navigation.
    const timeout = setTimeout(() => {
      window.settleSiteFonts(false);
      window.finishSiteStartup();
    }, 30000);
  })();
</script>
